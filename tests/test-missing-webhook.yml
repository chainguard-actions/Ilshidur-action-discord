name: Test missing DISCORD_WEBHOOK fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without DISCORD_WEBHOOK (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          args: "Hello from test"
        env:
          DISCORD_WEBHOOK: ""

      - name: Assert action failed due to missing DISCORD_WEBHOOK
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when DISCORD_WEBHOOK is not set, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when DISCORD_WEBHOOK is missing"

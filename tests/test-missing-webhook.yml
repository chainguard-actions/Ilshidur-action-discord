name: Test missing DISCORD_WEBHOOK error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without DISCORD_WEBHOOK (expect failure)
        id: action
        uses: .
        with:
          args: "Hello from test"
        continue-on-error: true

      - name: Assert action failed due to missing webhook
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when DISCORD_WEBHOOK is not set"
            exit 1
          fi
          echo "PASS: action correctly failed when DISCORD_WEBHOOK is missing"

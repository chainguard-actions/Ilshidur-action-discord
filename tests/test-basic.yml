name: Test basic Discord message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_WORKFLOW: test-workflow
      GITHUB_ACTOR: test-actor
      GITHUB_EVENT_NAME: push
      GITHUB_ACTION: test-action
      DISCORD_WEBHOOK: http://localhost:9999/api/webhooks/test/token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock Discord webhook server
        run: |
          python3 -c "
          import http.server, threading, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('Received POST:', body.decode(), flush=True)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{\"id\":\"1\"}')
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('localhost', 9999), Handler)
          server.serve_forever()
          " &
          sleep 1
          echo "Mock server started"

      - name: Create mock event file
        run: |
          echo '{"action":"push","repository":{"full_name":"test-owner/test-repo"}}' > /tmp/event.json
          echo "GITHUB_EVENT_PATH=/tmp/event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          args: Hello from test

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error"

name: Test basic Discord message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock Discord webhook server
        run: |
          # Start a simple HTTP server that accepts POST requests and returns a Discord-like 200 response
          python3 -c "
import http.server, json, sys

class Handler(http.server.BaseHTTPRequestHandler):
    def do_POST(self):
        length = int(self.headers.get('Content-Length', 0))
        body = self.rfile.read(length)
        print('Received POST to:', self.path, flush=True)
        print('Body:', body.decode('utf-8', errors='replace'), flush=True)
        self.send_response(200)
        self.send_header('Content-Type', 'application/json')
        self.end_headers()
        self.wfile.write(json.dumps({'id': '123456789', 'type': 1, 'content': 'test'}).encode())
    def log_message(self, format, *args):
        pass

server = http.server.HTTPServer(('0.0.0.0', 9999), Handler)
print('Mock server listening on port 9999', flush=True)
server.serve_forever()
" &
          sleep 2
          echo "Mock server started"

      - id: action
        uses: .
        with:
          args: "Hello from GitHub Actions test!"
        env:
          DISCORD_WEBHOOK: http://172.17.0.1:9999

      - name: Assert action completed successfully
        run: |
          echo "Action ran with args input and completed successfully"
          echo "PASS"

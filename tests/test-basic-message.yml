name: Test basic message sending
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock Discord webhook server
        run: |
          # Start a simple HTTP server that accepts POST requests and returns 200
          # The Discord webhook response format is a JSON message object
          python3 -c "
          import http.server, threading, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('Received POST to:', self.path)
                  print('Body:', body.decode('utf-8', errors='replace'))
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  # Discord returns a message object on success with wait=true
                  self.wfile.write(json.dumps({'id': '123456789', 'content': 'test'}).encode())
              def log_message(self, fmt, *args):
                  print(fmt % args)

          server = http.server.HTTPServer(('0.0.0.0', 9999), Handler)
          print('Mock server listening on port 9999')
          server.serve_forever()
          " &
          # Wait for server to be ready
          sleep 2
          echo "Mock server started"

      - name: Run action with mock webhook
        id: action
        uses: .
        with:
          args: "Hello from GitHub Actions test"
        env:
          DISCORD_WEBHOOK: "http://172.17.0.1:9999/webhook"
          GITHUB_EVENT_NAME: push
          GITHUB_WORKFLOW: "Test Workflow"
          GITHUB_ACTOR: "test-actor"
          GITHUB_REPOSITORY: "test-owner/test-repo"

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with valid webhook, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action successfully sent message to mock webhook"

name: Test basic message with args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_WORKFLOW: test-workflow
      GITHUB_ACTOR: test-actor
      GITHUB_ACTION: test-action
      DISCORD_WEBHOOK: https://discord.invalid/api/webhooks/000000000000000000/fake-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake GitHub event file
        run: |
          echo '{"action":"push","repository":{"full_name":"test-owner/test-repo"}}' > /tmp/fake-event.json
          echo "GITHUB_EVENT_PATH=/tmp/fake-event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          args: Hello from test!
        continue-on-error: true

      - name: Assert action was invoked with args (failed at HTTP, not at env/arg validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the Discord webhook URL is fake (HTTP error),
          # not because args or required env vars were missing.
          # A failure here means the args input was accepted and processed.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with args input and failed at HTTP call as expected (fake webhook URL)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
